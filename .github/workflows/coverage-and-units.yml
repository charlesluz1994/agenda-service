name: Build and deploy JAR app - agendaservice

on:
  pull_request:
    branches:
      - main

jobs:
  test:
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Set up Java version
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build unit tests
      run: mvn clean test




